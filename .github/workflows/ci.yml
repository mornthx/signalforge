name: CI

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        preset: [debug, release, debug-asan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 13
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 ninja-build xvfb libcurl4-openssl-dev socat
          # M15 visual tests use stdlib-only Python via
          # tests/visual/lib/runner.py — no pytest required.
          # Per V0 charter §3 + CLAUDE.md §1: no new top-level deps.

      - name: Install Qt 6.10.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtserialport'
          cache: true

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: xvfb-run --auto-servernum ctest --preset ${{ matrix.preset }} --output-on-failure

      # M15 S5 — visual-test screenshot artifact upload (per
      # M15-concerns C5 + C7). Uploads any captures produced
      # under tests/screenshots/** so reviewers can compare
      # actual vs committed baseline locally on a CI failure.
      # `if: always()` so artifacts upload even when ctest fails.
      # No vision-LLM in CI (C7); pixel-diff is the only gate.
      - name: Upload visual-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-screenshots-${{ matrix.preset }}
          path: |
            tests/screenshots/
          if-no-files-found: ignore
          retention-days: 14
