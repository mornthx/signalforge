name: CI

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        preset: [debug, release, debug-asan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 13
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 ninja-build xvfb libcurl4-openssl-dev socat
          # M15 visual tests use stdlib-only Python via
          # tests/visual/lib/runner.py — no pytest required.
          # Per V0 charter §3 + CLAUDE.md §1: no new top-level deps.

      - name: Install Qt 6.10.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtserialport'
          cache: true

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: xvfb-run --auto-servernum ctest --preset ${{ matrix.preset }} --output-on-failure
