name: CI

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        preset: [debug, release, debug-asan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 13
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 ninja-build xvfb libcurl4-openssl-dev socat

      - name: Install pytest (M15 visual tests)
        run: |
          # Visual tests under tests/visual/ shell out to
          # `python3 -m pytest`. CI's `python3` is the toolcache
          # binary at /opt/hostedtoolcache/Python/.../python3, not
          # the system one — so apt's `python3-pytest` would not be
          # importable. Install via pip into whichever python3 is
          # on PATH; pytest is the only test-only dep we need.
          python3 -m pip install --upgrade --user pytest

      - name: Install Qt 6.10.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtserialport'
          cache: true

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: xvfb-run --auto-servernum ctest --preset ${{ matrix.preset }} --output-on-failure
